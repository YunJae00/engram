name: Isolated guest validation

on:
  push:
    branches: [codex/isolated-worker]
    paths:
      - '.github/workflows/worker-guest.yml'
      - 'apps/desktop/e2e/fixtures/guest/**'
      - 'apps/desktop/scripts/test-worker-guest.mjs'
      - 'apps/desktop/scripts/guest-worker.mjs'
      - 'apps/desktop/scripts/guest-resources.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build disposable guest image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build signed-package guest filesystem
        run: bash apps/desktop/e2e/fixtures/guest/build-image.sh "$RUNNER_TEMP/engram-guest-image"
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-guest-image
          path: ${{ runner.temp }}/engram-guest-image/*
          retention-days: 3
          if-no-files-found: error
      - name: Install guest emulator in disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Validate independent virtual inputs
        run: |
          mkdir -p tmp
          node apps/desktop/scripts/test-worker-guest.mjs --qemu "$(command -v qemu-system-x86_64)" --image "$RUNNER_TEMP/engram-guest-image" --output "$PWD/tmp/worker-guest-validation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-guest-results
          path: tmp/worker-guest-validation/**
          retention-days: 3
          if-no-files-found: warn
