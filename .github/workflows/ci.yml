name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      # Routine releases skip the Electron e2e shards (checks, unit tests and native
      # still run); the weekly full run and big changes keep them.
      skip_e2e:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      native_only:
        description: Run only the owned Windows desktop fixture
        type: boolean
        default: false
      native_runner:
        description: Windows image for the owned desktop fixture
        type: choice
        options: [windows-latest, windows-2022]
        default: windows-latest

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}-${{ inputs.native_only || false }}-${{ inputs.native_runner || 'windows-latest' }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !inputs.native_only }}
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    # A healthy run takes about 10 minutes; a hung install must not hold a runner for an hour.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - run: npm run check
      # The model catalogue points at someone else's server; a renamed file
      # there is a 404 the first user with that much RAM discovers.

  checks:
    if: ${{ always() && !inputs.native_only }}
    name: typecheck · lint · unit
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require checks on both operating systems
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success

  e2e-shards:
    if: ${{ !inputs.native_only && !inputs.skip_e2e }}
    name: Electron (${{ matrix.os }}) shard ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26-intel]
        shard: [1, 2, 3, 4]
    # Shards take 6-15 minutes; the slowest Windows shard sets this bound.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.shard }}
          path: apps/desktop/test-results
          retention-days: 7

  e2e:
    if: ${{ always() && !inputs.native_only && !inputs.skip_e2e }}
    name: end-to-end (Electron)
    needs: e2e-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.e2e-shards.result }}
        run: test "$RESULT" = success

  desktop-native:
    name: native desktop control (owned fixture)
    runs-on: ${{ inputs.native_runner || 'windows-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Native desktop control fixture
        run: node apps/desktop/scripts/test-desktop-native.mjs
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-desktop-results
          path: |
            tmp/desktop-native-ci-*/result.json
            tmp/desktop-medium-ci-*/harness.log
            tmp/desktop-medium-ci-*/launcher-error.txt
            tmp/desktop-medium-ci-*/*-token.json
            tmp/desktop-medium-ci-*/*-access.json
            tmp/desktop-medium-ci-*/child-launch.json
            tmp/desktop-medium-ci-*/child-events.json
          if-no-files-found: ignore
          retention-days: 7

  desktop-native-macos:
    if: ${{ !inputs.native_only }}
    name: native macOS build and policy checks
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: node apps/desktop/scripts/build-desktop.mjs
      - run: apps/desktop/native-bin/desktop/EngramDesktop --self-test
      - name: Import signing certificate
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/import-macos-signing
        env:
          ENGRAM_MAC_SIGNING_P12: ${{ secrets.ENGRAM_MAC_SIGNING_P12 }}
          ENGRAM_MAC_SIGNING_PASSWORD: ${{ secrets.ENGRAM_MAC_SIGNING_PASSWORD }}
      - name: Assert stable helper signing requirement
        if: ${{ env.ENGRAM_MAC_SIGN_IDENTITY != '' }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { signMacTarget } from './apps/desktop/scripts/adhoc-sign.mjs'
          signMacTarget('apps/desktop/native-bin/desktop/EngramDesktop', 'dev.engram.desktop')
          JS
      - name: Optional installed Office integration
        run: node apps/desktop/scripts/test-office-macos.mjs
      - name: Delete signing keychain
        if: ${{ always() && runner.os == 'macOS' && env.ENGRAM_MAC_SIGN_KEYCHAIN != '' }}
        shell: bash
        run: security delete-keychain "$ENGRAM_MAC_SIGN_KEYCHAIN"
