name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm exec vitest run --project unit --reporter=default --reporter=github-actions
      - run: pnpm exec vitest run --project timing --reporter=default --reporter=github-actions
      - run: pnpm run todo-scan
      - run: pnpm run css-scan
      # The model catalogue points at someone else's server; a renamed file
      # there is a 404 the first user with that much RAM discovers.

  e2e:
    name: end-to-end (Electron)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Native desktop control fixture
        run: node apps/desktop/scripts/test-desktop-native.mjs
        env:
          CI: 'true'
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-desktop-results
          path: tmp/desktop-native-ci-*/result.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/desktop/test-results
          retention-days: 7
