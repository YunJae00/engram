name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      native_only:
        description: Run only the owned Windows desktop fixture
        type: boolean
        default: false
      native_runner:
        description: Windows image for the owned desktop fixture
        type: choice
        options: [windows-latest, windows-2022]
        default: windows-latest

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}-${{ inputs.native_only || false }}-${{ inputs.native_runner || 'windows-latest' }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !inputs.native_only }}
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      # The model catalogue points at someone else's server; a renamed file
      # there is a 404 the first user with that much RAM discovers.

  checks:
    if: ${{ always() && !inputs.native_only }}
    name: typecheck · lint · unit
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Require checks on both operating systems
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success

  e2e-shards:
    if: ${{ !inputs.native_only }}
    name: Electron (${{ matrix.os }}) shard ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.shard }}
          path: apps/desktop/test-results
          retention-days: 7

  e2e:
    if: ${{ always() && !inputs.native_only }}
    name: end-to-end (Electron)
    needs: e2e-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.e2e-shards.result }}
        run: test "$RESULT" = success

  desktop-native:
    name: native desktop control (owned fixture)
    runs-on: ${{ inputs.native_runner || 'windows-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Native desktop control fixture
        run: node apps/desktop/scripts/test-desktop-native.mjs
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-desktop-results
          path: |
            tmp/desktop-native-ci-*/result.json
            tmp/desktop-medium-ci-*/harness.log
            tmp/desktop-medium-ci-*/launcher-error.txt
            tmp/desktop-medium-ci-*/*-token.json
            tmp/desktop-medium-ci-*/*-access.json
            tmp/desktop-medium-ci-*/child-launch.json
            tmp/desktop-medium-ci-*/child-events.json
          if-no-files-found: ignore
          retention-days: 7

  desktop-native-macos:
    if: ${{ !inputs.native_only }}
    name: native macOS build and policy checks
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: node apps/desktop/scripts/build-desktop.mjs
      - run: apps/desktop/native-bin/desktop/EngramDesktop --self-test
      - name: Optional installed Office integration
        run: node apps/desktop/scripts/test-office-macos.mjs
