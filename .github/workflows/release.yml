name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v0.1.0)
        required: true
      full_e2e:
        description: Also run the full Electron e2e shards (large or risky releases)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
      # Tag pushes have no inputs, so routine releases skip the e2e shards.
      skip_e2e: ${{ github.event.inputs.full_e2e != 'true' }}

  # Runs beside the installer build, so it adds no time unless it is slower than the build.
  smoke:
    needs: validate
    uses: ./.github/workflows/smoke.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-26-intel
            name: macos
    runs-on: ${{ matrix.os }}
    # The macOS installer build takes about 18 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: Import signing certificate
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/import-macos-signing
        env:
          ENGRAM_MAC_SIGNING_P12: ${{ secrets.ENGRAM_MAC_SIGNING_P12 }}
          ENGRAM_MAC_SIGNING_PASSWORD: ${{ secrets.ENGRAM_MAC_SIGNING_PASSWORD }}
      - name: Build installer
        shell: bash
        run: |
          set -o pipefail
          pnpm run dist 2>&1 | tee build.log || {
            tail -n 40 build.log | sed 's/^/::error::/'
            exit 1
          }
      - name: Verify packaged semantic worker
        run: node apps/desktop/scripts/smoke-semantic.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          retention-days: 7
      - name: Delete signing keychain
        if: ${{ always() && runner.os == 'macOS' && env.ENGRAM_MAC_SIGN_KEYCHAIN != '' }}
        shell: bash
        run: security delete-keychain "$ENGRAM_MAC_SIGN_KEYCHAIN"

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts
      # Keep installation and runtime notices attached to every release.
      - name: Compose the download section
        id: notes
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo '## ⬇ Download'
            echo
            echo "- **Windows** — [Engram-Setup-${version}.exe](${base}/Engram-Setup-${version}.exe)"
            echo
            echo "- **macOS Apple Silicon** — [Engram-${version}-arm64.dmg](${base}/Engram-${version}-arm64.dmg)"
            echo "- **macOS Intel** — [Engram-${version}-x64.dmg](${base}/Engram-${version}-x64.dmg)"
            echo
            echo 'macOS builds use a stable self-signed certificate and are not notarized. Open Anyway is still required. After installing this version, remove Engram from Accessibility with − and add /Applications/Engram.app again with + once; subsequent updates should retain permission. Computer control requires Accessibility and Screen Recording permissions; Office automation additionally requires installed, activated Office apps and Automation permission.'
            echo
            echo '- **Windows:** SmartScreen says it blocked an unrecognized app. The **Run anyway** button is hidden until you click **More info** first.'
            echo 'Claude is installed separately by the user from Settings → AI or during onboarding. The official Anthropic runtime and terms apply; it is not included in this installer.'
            echo
            echo '---'
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Published, not drafted: a draft is invisible on the repo page and
          # the auto-updater's /releases/latest returns 406 while one is pending.
          draft: false
          # The generated "What's Changed" list lands under this block.
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          files: artifacts/**/*
