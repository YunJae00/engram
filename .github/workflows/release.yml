name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        shell: bash
        run: |
          set -o pipefail
          pnpm run dist 2>&1 | tee build.log || {
            tail -n 40 build.log | sed 's/^/::error::/'
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Which file a visitor should click, named per platform. Written here
      # rather than by hand each release: the asset list alone makes someone
      # on an Intel Mac guess between two .dmg files. A list, not a table —
      # a markdown table needs a header row, and an empty one renders as a
      # blank band above the links.
      - name: Compose the download section
        id: notes
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo '## ⬇ Download'
            echo
            echo "- **macOS** (Apple Silicon) — [Engram-${version}-arm64.dmg](${base}/Engram-${version}-arm64.dmg)"
            echo "- **macOS** (Intel) — [Engram-${version}.dmg](${base}/Engram-${version}.dmg)"
            echo "- **Windows** — [Engram-Setup-${version}.exe](${base}/Engram-Setup-${version}.exe)"
            echo
            echo 'Neither installer is signed by an identified developer, so both platforms stop the first launch.'
            echo
            echo '- **Windows:** SmartScreen says it blocked an unrecognized app. The **Run anyway** button is hidden until you click **More info** first.'
            echo '- **macOS:** open Engram, let it be blocked, then **System Settings → Privacy & Security → Open Anyway**.'
            echo
            echo '---'
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Published, not drafted: a draft is invisible on the repo page and
          # the auto-updater's /releases/latest returns 406 while one is pending.
          draft: false
          # The generated "What's Changed" list lands under this block.
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          files: artifacts/**/*
