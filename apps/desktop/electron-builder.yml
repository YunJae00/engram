appId: dev.engram.app
productName: Engram
publish:
  provider: github
  owner: YunJae00
  repo: engram
  releaseType: release
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!node_modules/@anthropic-ai/claude-agent-sdk*/**"
extraResources:
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: bundle
    to: bin
    filter: ["**/*"]
asar: true
afterPack: scripts/adhoc-sign.mjs
asarUnpack:
  - "node_modules/@openai/codex-*/**"
npmRebuild: false
nsis:
  # No spaces: latest.yml and GitHub rewrite them differently, breaking self-update.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
# Per-platform files lists must repeat the positive patterns; an exclusion-only list implies "**/*".
linux:
  target:
    - AppImage
    - tar.gz
  category: Office
  maintainer: engram@local
  files:
    - out/**
    - package.json
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/**"
    - "!node_modules/@anthropic-ai/claude-agent-sdk*/**"
    - "!node_modules/@openai/codex-win32-*/**"
    - "!node_modules/@openai/codex-darwin-*/**"
win:
  target:
    - nsis
  files:
    - out/**
    - package.json
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"
    - "!node_modules/@anthropic-ai/claude-agent-sdk*/**"
    - "!node_modules/@openai/codex-darwin-*/**"
    - "!node_modules/@openai/codex-linux-*/**"
    - "!node_modules/@openai/codex-win32-arm64/**"
mac:
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon-mac.png
  # null: skip electron-builder signing (stale seal on CI, personal cert locally); afterPack signs ad-hoc.
  identity: null
  extendInfo:
    NSAppleEventsUsageDescription: Engram uses app automation to read and edit documents you choose.
    NSScreenCaptureUsageDescription: Engram captures selected app windows when you ask it to inspect them.
  category: public.app-category.productivity
  darkModeSupport: true
  files:
    - out/**
    - package.json
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/**"
    - "!node_modules/@anthropic-ai/claude-agent-sdk*/**"
    - "!node_modules/@openai/codex-win32-*/**"
    - "!node_modules/@openai/codex-linux-*/**"
    # Both darwin runtimes ship: files globs strip ${arch}; afterPack removes the other chip's runtime.
