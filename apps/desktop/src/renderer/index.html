<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Engram</title>
    <style>
      /* Painted before a single line of the app has run. A renderer process
         takes seconds to start on a machine whose endpoint protection
         inspects it (measured: the same bundle runs in 47ms once the process
         is up), and for those seconds the window would be blank.

         It paints NO ground of its own: the window is already the app's
         colour, and a second colour here - however close - is a flash on the
         way in. Only the name is drawn, in an ink that reads on both. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transition: opacity 260ms ease;
        font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 15px;
        letter-spacing: 0.02em;
        color: #8a8b95;
        animation: boot-breathe 1.9s ease-in-out infinite;
      }
      @keyframes boot-breathe {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 0.62;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot {
          animation: none;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Beside the app, not inside it: React replacing #root must not be
         the frame that removes this. It fades out when the app says so. -->
    <div class="boot" id="boot">Engram</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
